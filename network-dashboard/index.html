<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1"
>

<title>Camera Network Scanner</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

    background:
    #020617;

    color: white;

}

.container {

    max-width: 1200px;

    margin: auto;

    padding: 35px 20px;

}

.header {

    display: flex;

    justify-content:
    space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 30px;

}

h1 {

    margin: 0;

    font-size: 34px;

}

.subtitle {

    color: #94a3b8;

    margin-top: 7px;

}

button {

    border: none;

    border-radius: 12px;

    padding: 14px 25px;

    background:
    #2563eb;

    color: white;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

}

button:hover {

    background:
    #1d4ed8;

}

button:disabled {

    opacity: .5;

    cursor: wait;

}

.stats {

    display: grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(190px, 1fr)
    );

    gap: 15px;

    margin-bottom: 30px;

}

.stat {

    background:
    #0f172a;

    border:
    1px solid #1e293b;

    border-radius: 18px;

    padding: 20px;

}

.stat.camera {

    border-color:
    #dc2626;

    background:
    #1c1010;

}

.number {

    font-size: 30px;

    font-weight: 800;

}

.label {

    color:
    #64748b;

    margin-top: 5px;

}

.devices {

    display: grid;

    grid-template-columns:
    repeat(
        auto-fill,
        minmax(330px, 1fr)
    );

    gap: 18px;

}

.card {

    background:
    #0f172a;

    border:
    1px solid #1e293b;

    border-radius: 20px;

    padding: 22px;

}

.card.camera {

    border-color:
    #7f1d1d;

    box-shadow:
    0 0 25px
    rgba(220,38,38,.08);

}

.top {

    display: flex;

    gap: 15px;

    align-items: center;

    margin-bottom: 18px;

}

.icon {

    width: 60px;

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
    #172554;

    border-radius: 16px;

    font-size: 32px;

}

.card.camera .icon {

    background:
    #450a0a;

}

.name {

    font-size: 18px;

    font-weight: 800;

    word-break: break-word;

}

.type {

    color:
    #60a5fa;

    margin-top: 4px;

}

.card.camera .type {

    color:
    #f87171;

}

.confidence {

    display: inline-block;

    margin-top: 8px;

    padding: 4px 9px;

    border-radius: 8px;

    font-size: 12px;

    font-weight: 700;

}

.high {

    background:
    #064e3b;

    color:
    #6ee7b7;

}

.medium {

    background:
    #78350f;

    color:
    #fcd34d;

}

.low {

    background:
    #334155;

    color:
    #cbd5e1;

}

.row {

    display: flex;

    justify-content:
    space-between;

    gap: 15px;

    padding: 8px 0;

    border-top:
    1px solid #1e293b;

    font-size: 13px;

}

.row .label {

    color:
    #64748b;

}

.row .value {

    color:
    #cbd5e1;

    text-align: right;

    word-break: break-word;

}

.reasons {

    margin-top: 15px;

    padding: 12px;

    border-radius: 12px;

    background:
    #020617;

    color:
    #94a3b8;

    font-size: 13px;

}

.reasons strong {

    color:
    #cbd5e1;

}

.status {

    grid-column:
    1 / -1;

    text-align: center;

    color:
    #64748b;

    padding: 70px 20px;

}

@media(max-width:650px) {

    .header {

        flex-direction:
        column;

        align-items:
        stretch;

    }

    button {

        width: 100%;

    }

}

</style>

</head>


<body>


<div class="container">


<div class="header">


<div>

<h1>
📷 Camera Network Scanner
</h1>

<div class="subtitle">

Find cameras and other devices
on your Wi-Fi

</div>

</div>


<button
id="scanButton"
onclick="scanNetwork()"
>

Scan Network

</button>


</div>


<div class="stats">


<div class="stat camera">

<div
class="number"
id="cameraCount"
>

—

</div>

<div class="label">

Possible Cameras

</div>

</div>


<div class="stat">

<div
class="number"
id="deviceCount"
>

—

</div>

<div class="label">

Total Devices

</div>

</div>


<div class="stat">

<div
class="number"
id="network"
>

—

</div>

<div class="label">

Network

</div>

</div>


</div>


<div
class="devices"
id="devices"
>

<div class="status">

Click
<b>Scan Network</b>
to begin.

</div>

</div>


</div>


<script>


async function scanNetwork() {


const button =
document.getElementById(
    "scanButton"
);


const devices =
document.getElementById(
    "devices"
);


button.disabled = true;

button.textContent =
"Scanning...";


devices.innerHTML = `

<div class="status">

🔎 Looking for cameras
and other devices...

<br><br>

This can take a little while.

</div>

`;


try {


const response =
await fetch("/scan");


const data =
await response.json();


if (data.error) {

throw new Error(
    data.error
);

}


document.getElementById(
    "cameraCount"
).textContent =
data.camera_count;


document.getElementById(
    "deviceCount"
).textContent =
data.count;


document.getElementById(
    "network"
).textContent =
data.network;


if (
    data.devices.length === 0
) {

devices.innerHTML = `

<div class="status">

No devices found.

</div>

`;

return;

}


devices.innerHTML =
data.devices.map(
device => {


const isCamera =
device.type
.toLowerCase()
.includes("camera");


let confidenceClass =
"low";


if (
device.confidence ===
"HIGH"
) {

confidenceClass =
"high";

}
else if (
device.confidence ===
"MEDIUM"
) {

confidenceClass =
"medium";

}


const reasons =
device.reasons
.map(
reason =>
`• ${escapeHtml(reason)}`
)
.join("<br>");


const services =
device.services.length
?
device.services.join(", ")
:
"None detected";


const ports =
device.ports.length
?
device.ports.join(", ")
:
"None detected";


return `

<div class="card
${isCamera ? "camera" : ""}">


<div class="top">


<div class="icon">

${device.icon}

</div>


<div>

<div class="name">

${escapeHtml(
    device.hostname
)}

</div>


<div class="type">

${escapeHtml(
    device.type
)}

</div>


<div
class="confidence
${confidenceClass}"
>

${device.confidence}
confidence

</div>

</div>


</div>


<div class="row">

<span class="label">
IP Address
</span>

<span class="value">

${escapeHtml(
    device.ip
)}

</span>

</div>


<div class="row">

<span class="label">
MAC Address
</span>

<span class="value">

${escapeHtml(
    device.mac
)}

</span>

</div>


<div class="row">

<span class="label">
Services
</span>

<span class="value">

${escapeHtml(
    services
)}

</span>

</div>


<div class="row">

<span class="label">
Open Ports
</span>

<span class="value">

${escapeHtml(
    ports
)}

</span>

</div>


<div class="reasons">

<strong>
Why?
</strong>

<br><br>

${reasons}

</div>


</div>

`;

}).join("");


}

catch(error) {


devices.innerHTML = `

<div class="status">

❌ ${escapeHtml(
    error.message
)}

</div>

`;

}


finally {

button.disabled =
false;

button.textContent =
"Scan Network";

}

}


function escapeHtml(value) {

const div =
document.createElement(
    "div"
);

div.textContent =
value || "Unknown";

return div.innerHTML;

}


</script>


</body>

</html>
